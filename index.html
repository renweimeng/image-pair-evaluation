<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>匿名图像评价</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7fb; color: #152238; }
    main { width: min(88vw, 520px); padding: 36px; border-radius: 22px; background: #fff; box-shadow: 0 18px 55px rgba(29, 55, 92, .12); text-align: center; }
    .spinner { width: 34px; height: 34px; margin: 0 auto 18px; border: 4px solid #dce6f5; border-top-color: #356ee6; border-radius: 50%; animation: spin .8s linear infinite; }
    h1 { margin: 0 0 10px; font-size: 24px; }
    p { margin: 0; color: #5a6b83; line-height: 1.65; }
    a { color: #245bc5; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main>
    <div class="spinner" aria-hidden="true"></div>
    <h1>正在连接匿名图像评价系统</h1>
    <p id="status">请稍候，页面将自动进入。</p>
  </main>
  <script>
    (() => {
      const status = document.getElementById("status");
      const endpoint = "https://raw.githubusercontent.com/renweimeng/image-pair-evaluation/main/current_url.txt?t=" + Date.now();
      fetch(endpoint, { cache: "no-store" })
        .then((response) => {
          if (!response.ok) throw new Error("入口信息暂不可用");
          return response.text();
        })
        .then((text) => {
          const target = text.trim();
          const parsed = new URL(target);
          if (parsed.protocol !== "https:" || !parsed.hostname.endsWith(".trycloudflare.com")) {
            throw new Error("入口地址校验失败");
          }
          window.location.replace(parsed.href);
        })
        .catch(() => {
          status.innerHTML = "连接入口暂时更新中，请稍后刷新本页。";
          document.querySelector(".spinner").style.display = "none";
        });
    })();
  </script>
</body>
</html>
